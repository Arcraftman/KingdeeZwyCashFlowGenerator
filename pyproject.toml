[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kingdee-zwy-cash-flow-generator"
version = "0.1.0"
description = "Cash flow report generator for Kingdee Zwy detail ledgers"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15,<6",
    "pandas>=2,<4",
    "openpyxl>=3.1,<4",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
kingdee-zwy-cashflow = "KingdeeZwyCashFlowGenerator.cli:main"
kingdee-zwy-cashflow-gui = "KingdeeZwyCashFlowGenerator.app.desktop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["KingdeeZwyCashFlowGenerator*"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".weiyu", "build", "dist", "temp"]

[tool.ruff.lint]
select = ["E4", "E9"]
